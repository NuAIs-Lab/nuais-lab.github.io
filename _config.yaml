# site properties and page defaults
title: NuAIs Lab
subtitle: Institute of Nuclear and Particle Physics (INPP), NCSR Demokritos
description: NuAIs Lab — Neutrinos, AI, Sensors. Research on neutrino physics, machine learning and detector instrumentation at NCSR Demokritos, Greece.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: appinpp.group@gmail.com
  #orcid: 0000-0001-8713-9213
  #google-scholar: ETJoidYAAAAJ
  #github: your-lab
  #twitter: YourLabHandle
  #youtube: YourLabChannel

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
