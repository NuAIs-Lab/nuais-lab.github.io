<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3b66"/>
      <stop offset="100%" stop-color="#1f6f5c"/>
    </linearGradient>
  </defs>

  <!-- MARK: an orbital ring (detector/accelerator ring) with a node graph inscribed,
       reading simultaneously as a physics ring and a neural network -->
  <g transform="translate(130,130)">
    <circle r="92" fill="none" stroke="url(#markGrad)" stroke-width="5"/>
    <circle r="92" fill="none" stroke="#c98a1e" stroke-width="1.4" stroke-dasharray="1 9" opacity="0.9"/>

    <!-- graph nodes on the ring, connected through the center: detector hits + neural graph at once -->
    <g stroke="#0d3b66" stroke-width="2.2" opacity="0.95">
      <line x1="0" y1="-92" x2="0" y2="0"/>
      <line x1="79.7" y1="-46" x2="0" y2="0"/>
      <line x1="79.7" y1="46" x2="0" y2="0"/>
      <line x1="0" y1="92" x2="0" y2="0"/>
      <line x1="-79.7" y1="46" x2="0" y2="0"/>
      <line x1="-79.7" y1="-46" x2="0" y2="0"/>
    </g>
    <g fill="#c98a1e">
      <circle cx="0" cy="-92" r="6.5"/>
      <circle cx="79.7" cy="-46" r="6.5"/>
      <circle cx="79.7" cy="46" r="6.5"/>
      <circle cx="0" cy="92" r="6.5"/>
      <circle cx="-79.7" cy="46" r="6.5"/>
      <circle cx="-79.7" cy="-46" r="6.5"/>
    </g>
    <circle r="9" fill="#0d3b66"/>
  </g>

  <!-- WORDMARK -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <text x="266" y="122" font-size="64" font-weight="700" fill="#0d3b66" letter-spacing="1">NuAIs</text>
    <text x="480" y="122" font-size="64" font-weight="300" fill="#1f6f5c" letter-spacing="1">Lab</text>
    <text x="268" y="156" font-size="19" font-weight="500" fill="#3a3a3a" letter-spacing="3.5">NEUTRINOS &#183; AI &#183; SENSORS</text>
    <line x1="268" y1="172" x2="640" y2="172" stroke="#c98a1e" stroke-width="2"/>
    <text x="268" y="196" font-size="15" fill="#6b6b6b" letter-spacing="0.5">Institute of Nuclear and Particle Physics &#8212; NCSR Demokritos</text>
  </g>
</svg>
